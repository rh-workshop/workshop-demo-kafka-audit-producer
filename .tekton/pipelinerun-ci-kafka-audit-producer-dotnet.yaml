# CI del host de ejemplo del paquete .NET, disparado por Pipelines as Code (PAC).
#
# Lo que se entrega a los equipos es el PAQUETE NuGet; esta imagen es el host que lo demuestra y
# solo se despliega en dev y test.
#
# QUE HACE ESTE FICHERO AQUI. El equipo de la APLICACION decide QUE se ejecuta; la PLATAFORMA
# gobierna CON QUE (el Pipeline y las Tasks, en workshop-demo-platform-config) y CON QUE PERMISOS.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ci-kafka-audit-producer-dotnet
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push, pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main, develop, release/*]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  pipelineRef:
    # Resolver 'cluster': el Pipeline lo despliega Argo desde el repo de plataforma, no vive aqui.
    resolver: cluster
    params:
      - {name: kind, value: pipeline}
      - {name: name, value: ci-build-image}
      - {name: namespace, value: workshop-demo-dev}
  taskRunTemplate:
    serviceAccountName: builder
  timeouts:
    pipeline: 1h0m0s
  params:
    - name: revision
      value: "{{revision}}"
    - name: app-repo
      value: "{{repo_url}}"
    - name: config-repo
      value: https://github.com/rh-workshop/workshop-demo-kafka-audit-pipeline-config.git
    # Selecciona la Task dotnet-test para las pruebas unitarias.
    - name: language
      value: dotnet
    - name: image-repository
      value: company-quay-quay-quay-enterprise.apps.ocp.hq2ss.sandbox3270.opentlc.com/company-dev/kafka-audit-producer-dotnet
    - name: image-name
      value: kafka-audit-producer-dotnet
    - name: containerfile
      value: ./Dockerfile
    - name: overlay-path
      value: overlays/dev
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 2Gi } }
    - name: config
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 1Gi } }
    - name: git-credentials
      secret: { secretName: git-credentials }
    - name: registry-credentials
      secret: { secretName: quay-push-credentials }
    - name: signing-key
      secret: { secretName: cosign-signing-key }
    - name: acs-credentials
      secret: { secretName: acs-pipeline-credentials }
